<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rectangle Row</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f172a;
        font-family: Arial, sans-serif;
      }

      body {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .count {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #d9fdd3;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .last-departure {
        position: absolute;
        top: 48px;
        left: 50%;
        transform: translateX(-50%);
        color: #e2e8f0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        opacity: 0.9;
      }

      .countdown {
        position: absolute;
        top: 20px;
        right: 20px;
        color: #f8fafc;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.04em;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.4);
        border-radius: 999px;
        padding: 8px 14px;
        white-space: nowrap;
      }

      .timeline-stage {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .divider {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 4px;
        background: rgba(148, 163, 184, 0.9);
        transform: translateX(-50%);
      }

      .timeline {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        height: 40px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0;
      }

      #past-row {
        right: 50%;
        margin-right: 12px;
        justify-content: flex-end;
      }

      #future-row {
        left: 50%;
        margin-left: 12px;
        justify-content: flex-start;
      }

      .row {
        width: 100vw;
        height: 40px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0;
      }

      .rect {
        height: 30px;
        border-width: 2px;
        border-style: solid;
      }

      .title {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 24px;
        background: rgba(15, 23, 42, 0.96);
        border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      }

      .legend {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 24px;
        background: rgba(15, 23, 42, 0.96);
        border-top: 1px solid rgba(148, 163, 184, 0.3);
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #e2e8f0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .legend-swatch {
        width: 28px;
        height: 18px;
        border-width: 2px;
        border-style: solid;
        display: inline-block;
      }

      .rect.design1,
      .legend-swatch.design1 {
        background: #01530b;
        border-color: #50914c;
      }

      .rect.design2,
      .legend-swatch.design2 {
        background: #96141460;
        border-color: #c54747;
      }

      .rect.design3,
      .legend-swatch.design3 {
        background: #00c91b;
        border-color: #00e91f;
      }

      .rect.design4,
      .legend-swatch.design4 {
        background: #ff1818;
        border-color: #ffff2c;
      }

      .rect.design5,
      .legend-swatch.design5 {
        background: #6d660c;
        border-color: #a09612;
      }

      .outstanding {
        transform: translateY(-30px);
      }
    </style>
  </head>
  <body>
    <div id="countdown" class="countdown">Next update in XX:XX</div>
    <div class="timeline-stage">
      <div class="divider" aria-hidden="true"></div>
      <div id="past-row" class="timeline" aria-label="Past timeline"></div>
      <div id="future-row" class="timeline" aria-label="Future timeline"></div>
    </div>

    <div class="title" aria-label="Current time and last departure information">
      <div id="count" class="count">Loading...</div>
      <div id="last-departure" class="last-departure">Last departure: --</div>
    </div>

    <div class="legend" aria-label="Flight status legend">
      <div class="legend-item">
        <span class="legend-swatch design1"></span><span>Estimated</span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch design3"></span><span>Departured</span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch design2"></span><span>Delayed</span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch design5"></span><span>EstimatedDelayed</span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch design4"></span><span>Cancelled</span>
      </div>
    </div>

    <script src="timelineData.js"></script>
    <script src="timelineRenderer.js"></script>
    <script src="script.js"></script>
  </body>
</html>
