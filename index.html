<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rectangle Row</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f172a;
        font-family: Arial, sans-serif;
      }

      body {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .count {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #d9fdd3;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .row {
        width: 100vw;
        height: 40px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0;
      }

      .rect {
        height: 30px;
        border-width: 2px;
        border-style: solid;
      }

      .rect.design1 {
        background: #01530b;
        border-color: #50914c;
      }

      .rect.design2 {
        background: #96141460;
        border-color: #c54747;
      }

      .rect.design3 {
        background: #00c91b;
        border-color: #00e91f;
        transform: translateY(-30px);
      }

      .rect.design4 {
        background: #ff1818;
        border-color: #ffff2c;
      }

      .rect.design5 {
        background: #6d660c;
        border-color: #a09612;
      }
    </style>
  </head>
  <body>
    <div id="count" class="count">Rectangles: 0</div>
    <div id="row" class="row" aria-label="Rectangle row"></div>
    <script src="script.js"></script>
  </body>
</html>
