<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Web Project</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --primary: #38bdf8;
        --accent: #22c55e;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        width: min(90vw, 700px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 40px 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 5vw, 3.5rem);
      }

      p {
        margin: 0 auto 24px;
        max-width: 52ch;
        line-height: 1.6;
        color: var(--muted);
      }

      .btn {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: var(--primary);
        color: #082f49;
        text-decoration: none;
        font-weight: 700;
        transition:
          transform 0.2s ease,
          filter 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello, world!</h1>
      <p>
        This is a simple single-page website created as a fresh HTML project.
        You can edit the content here to build your own landing page, portfolio,
        or app showcase.
      </p>
      <a class="btn" href="#">Get Started</a>
    </main>
  </body>
</html>
